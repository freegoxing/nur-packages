name: Update packages

on:
  workflow_dispatch:
  schedule:
    # Monday at 11:17 Beijing time
    - cron: '17 3 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check upstream versions and hashes
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -u scripts/update-packages.py

      - name: Review changes
        run: |
          git diff --check
          git diff -- pkgs/baidunetdisk/default.nix pkgs/lceda-pro/default.nix

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update/packages
          delete-branch: true
          commit-message: 'packages: update upstream versions'
          title: 'packages: update upstream versions'
          body: |
            Automatically update upstream versions and source SHA256 hashes.

            Full Nix build validation is not performed by this workflow.
          add-paths: |
            pkgs/baidunetdisk/default.nix
            pkgs/lceda-pro/default.nix
