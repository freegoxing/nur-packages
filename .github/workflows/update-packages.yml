name: Update packages

on:
  workflow_dispatch:
  schedule:
    # Monday at 11:17 Beijing time
    - cron: '17 3 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update packages
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: |
          nix shell nixpkgs#nix-update nixpkgs#curl nixpkgs#jq -c bash -euc '
            for package in baidunetdisk lceda-pro; do
              nix-update "$package" --flake --use-update-script
            done
          '

      - name: Build changed packages
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: |
          for package in baidunetdisk lceda-pro; do
            if ! git diff --quiet -- "pkgs/$package/default.nix"; then
              nix build --impure --no-link ".#$package"
            fi
          done

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update/packages
          delete-branch: true
          commit-message: 'packages: update upstream versions'
          title: 'packages: update upstream versions'
          body: Automatically update changed packages and their source hashes after building them.
          add-paths: |
            pkgs/baidunetdisk/default.nix
            pkgs/lceda-pro/default.nix
