name: Update Baidu Netdisk

on:
  workflow_dispatch:
  schedule:
    # 11:17 Beijing time
    - cron: '17 3 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update package
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: |
          nix shell nixpkgs#nix-update nixpkgs#curl nixpkgs#jq -c \
            nix-update baidunetdisk --flake --use-update-script

      - name: Build updated package
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: nix build --impure .#baidunetdisk

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update/baidunetdisk
          delete-branch: true
          commit-message: 'baidunetdisk: update'
          title: 'baidunetdisk: update'
          body: Automatically update Baidu Netdisk and its source hash.
          add-paths: pkgs/baidunetdisk/default.nix
