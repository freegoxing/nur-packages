name: Update packages

on:
  workflow_dispatch:
  schedule:
    # Monday at 11:17 Beijing time
    - cron: '17 3 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Prepare update tools
        timeout-minutes: 10
        run: |
          set -euo pipefail

          nix build nixpkgs#nix-update \
            --no-link \
            --print-build-logs \
            --log-format raw

          nix shell nixpkgs#nix-update \
            --print-build-logs \
            --log-format raw \
            -c nix-update --version

      - name: Update packages
        timeout-minutes: 25
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail

          for package in baidunetdisk lceda-pro; do
            echo "::group::Update $package"
            date -u

            timeout --kill-after=30s 10m \
              nix shell nixpkgs#nix-update \
                --print-build-logs \
                --log-format raw \
                -c nix-update "$package" --flake --use-update-script

            date -u
            echo "::endgroup::"
          done

      - name: Build changed packages
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: |
          for package in baidunetdisk lceda-pro; do
            if ! git diff --quiet -- "pkgs/$package/default.nix"; then
              nix build --impure --no-link ".#$package"
            fi
          done

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update/packages
          delete-branch: true
          commit-message: 'packages: update upstream versions'
          title: 'packages: update upstream versions'
          body: Automatically update changed packages and their source hashes after building them.
          add-paths: |
            pkgs/baidunetdisk/default.nix
            pkgs/lceda-pro/default.nix
